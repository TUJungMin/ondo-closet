spring:
  application:
    name: ondo-closet-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # 로컬 개발용 기본값. 배포(prod)에서는 반드시 JWT_SECRET 환경변수로 32자 이상 값을 넣어야 함
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  cors:
    # 프론트 주소. 여러 개면 쉼표로 구분 (예: https://ondo.vercel.app,http://localhost:5173)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5500}
  storage:
    local-dir: ${STORAGE_DIR:./uploads}
    # 응답의 photo 를 전체 주소로 만들 때 쓰는 서버 주소. 배포하면 실제 주소로 바꾼다 (예: https://api.ondo.app)
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  closet:
    max-items-per-user: 200
  ai:
    # 준호 님 AI 추론 서버 주소 (uvicorn main:app --port 8000). 비우면 AI 분석 API가 503을 돌려준다
    server-url: ${AI_SERVER_URL:http://127.0.0.1:8000}
    # 첫 요청은 모델을 메모리에 올리느라 오래 걸릴 수 있어 넉넉하게 잡는다
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
