# 배포: 관리형 PostgreSQL (Neon, Supabase 등)
# 필요한 환경변수: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
spring:
  datasource:
    # 예: jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # 해커톤 기간에는 update로 테이블을 자동 생성/변경. 실서비스라면 Flyway 같은 마이그레이션 도구로 교체
      ddl-auto: update
    show-sql: false

app:
  jwt:
    # 기본값 없음: 환경변수가 없으면 서버가 뜨지 않게 해서 개발용 키로 배포되는 사고를 막음
    secret: ${JWT_SECRET}
